  title: Full-custom Hangul set
  text: A set I designed myself, made with Balaguères, who agreed to produce it. Every modifier is a word that reminds me of my life in Korea.
  # Keys shown on the /uses card; the keyboard's own page lists them all.
  featured: [Enter, Del, Right Alt, ScrLk]
