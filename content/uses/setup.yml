software:
- name: VS Code
  icon: simple-icons:visualstudiocode
  line: Never looked back on this one.
- name: Claude Code
  icon: simple-icons:claude
  line: My main coding agent, for personal and work projects.
- name: Ghostty
  icon: simple-icons:ghostty
  line: Tried it after six years on iTerm2, and I really like it. Rose Pine Moon, Monaspace Neon, oh my zsh.
  config:
    path: ~/.config/ghostty/config
    body: |
      theme = Rose Pine Moon
      font-family = "Monaspace Neon"
      font-size = 14
      font-feature = calt
      macos-option-as-alt = left
      macos-titlebar-style = tabs

      window-padding-x = 8
      window-padding-y = 6
      window-padding-balance = true
      window-save-state = always

      cursor-style = bar
      cursor-style-blink = false
      copy-on-select = clipboard
      mouse-hide-while-typing = true

      keybind = global:ctrl+grave_accent=toggle_quick_terminal
      keybind = alt+backspace=text:\x1b\x7f
      quick-terminal-position = top
- name: Raycast
  icon: simple-icons:raycast
  line: Much faster than Spotlight. I only use a small part of it.
- name: Firefox Developer Edition
  icon: simple-icons:firefoxbrowser
  line: My daily browser, my small part against Chrome's monopoly 💪
- name: Obsidian
  icon: simple-icons:obsidian
  line: After Notion and Anytype, the one that fits. Synced with a self-hosted LiveSync.
- name: Hermes
  icon: material-symbols:smart-toy-outline
  line: Best discovery of 2026. Runs on the homelab, on Telegram from my phone.
- name: Tailscale
  icon: simple-icons:tailscale
  line: How my services reach each other. My family's NAS too, and exit nodes abroad.
